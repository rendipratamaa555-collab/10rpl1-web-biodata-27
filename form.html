<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIODATA</title>
    <link rel="stylesheet" href="style.css">
</head>

    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    background-color: #f5f5fa;
    color: #000000;
}

.container {
    width: 100%;
    max-width: 585px;
    margin: 0 auto;
    padding: 25px 22px;
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
}

h1 {
    margin-top: 15px;
    margin-bottom: 22px;
    font-size: 27px;
}

.form-group {
    margin-bottom: 14px;
}

.form-group > label {
    display: block;
    margin-bottom: 6px;
    font-size: 18px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 9px;
    font-family: Arial, sans-serif;
    font-size: 16px;
    border: 1px solid #cccccc;
    border-radius: 5px;
    outline: none;
    background-color: #ffffff;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #4778ed;
}

textarea {
    min-height: 53px;
    resize: vertical;
}

.radio-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.radio-label {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0;
    font-size: 17px;
    font-weight: normal;
    cursor: pointer;
}

.radio-label input {
    width: auto;
    margin: 0;
}

button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 4px;
    background-color: #4778ed;
    color: #ffffff;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #3567dc;
}

.hasil-container {
    width: 100%;
    max-width: 590px;
    margin: 0 auto;
    padding: 28px 22px;
    background-color: #ffffff;
    border-radius: 10px;
}

.data-item {
    margin-bottom: 18px;
    font-size: 18px;
    line-height: 1.4;
}

.data-item strong {
    font-weight: bold;
}

.kembali {
    display: inline-block;
    margin-top: 10px;
    color: #551a8b;
    font-size: 17px;
}

@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }

    .container,
    .hasil-container {
        padding: 20px 16px;
    }

    h1 {
        font-size: 24px;
    }

    .radio-group {
        gap: 8px;
    }

    .radio-label {
        font-size: 16px;
    }
}
    </style>
<body>

    <main class="container">

        <h1>BIODATA</h1>

        <form id="biodataForm">

            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" required></textarea>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan:</label>

                <select id="jurusan" required>
                    <option value="RPL">RPL</option>
                    <option value="TKR">TKR</option>
                    <option value="TKJ">TKJ</option>
                    <option value="AKL">AKL</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin:</label>

                <div class="radio-group">

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="gender"
                            value="Laki-laki"
                            checked
                        >
                        Laki-laki
                    </label>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="gender"
                            value="Perempuan"
                        >
                        Perempuan
                    </label>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="gender"
                            value="Boti"
                        >
                        Boti
                    </label>

                </div>
            </div>

            <div class="form-group">
                <label for="tinggi">Tinggi Badan (cm):</label>
                <input
                    type="number"
                    id="tinggi"
                    min="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="berat">Berat Badan (kg):</label>
                <input
                    type="number"
                    id="berat"
                    min="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="hobi">Hobi:</label>
                <input
                    type="text"
                    id="hobi"
                    required
                >
            </div>

            <div class="form-group">
                <label for="nohp">No. HP:</label>
                <input
                    type="tel"
                    id="nohp"
                    maxlength="13"
                    inputmode="numeric"
                    required
                >
            </div>

            <button type="submit">
                Simpan
            </button>

        </form>

    </main>

    <script src="script.js"></script>

</body>
</html>
